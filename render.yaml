# Persistent disk needs a paid instance (Starter+). Free web services
# lose the SQLite file on every deploy; ensure_sqlite_db.py re-seeds the demo DB.
services:
  - type: web
    name: edge-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python scripts/ensure_sqlite_db.py && gunicorn django_backend.wsgi:application --bind 0.0.0.0:$PORT
    disk:
      name: edge-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DB_PATH
        value: data/pse_analysis.db
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        # Replace with your Vercel URL after the UI deploy (keep localhost for local Vite).
        value: "http://localhost:5173"
